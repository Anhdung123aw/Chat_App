spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  flyway:
    enabled: false  # Disable Flyway for tests, use Hibernate auto-create
  
  kafka:
    bootstrap-servers: localhost:9092
    enabled: false  # Disable Kafka for unit tests
  
  data:
    redis:
      enabled: false  # Disable Redis for unit tests

logging:
  level:
    root: WARN
    com.example.chatcore: DEBUG
    org.springframework: WARN
    org.hibernate: WARN

# Phase 2 configs - Test values
chat:
  sla:
    default-first-response-minutes: 5
    default-resolution-minutes: 60
    monitoring-interval-minutes: 1
    report-interval-hours: 1
  
  assignment:
    strategy: LOAD_BALANCED
    max-retries: 3
  
  alert:
    slack-webhook-url: http://localhost:8080/test/webhook
    queue-depth-threshold: 10
    sla-breach-threshold-percent: 20
    low-agent-capacity-threshold: 30
    high-wait-time-minutes: 15
  
  scheduler:
    sla-monitoring-cron: "0 0/1 * * * ?"
    sla-report-cron: "0 0 * * * ?"
    alert-monitoring-cron: "0 0/5 * * * ?"
    stale-agent-cron: "0 0/2 * * * ?"
    enabled: false  # Disable schedulers for tests
  
  reporting:
    default-range-days: 7
